name: CI

on:
  push:
    branches: [ main, master ]
  # Every pull request, whatever branch it targets. Restricting this to main
  # and master meant a PR stacked on another branch got no run at all - which
  # is where one is needed most, since the branch it builds on is not merged
  # yet and nothing else has tested the combination.
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11', '3.14']

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m pip install tools/nodegraph/nodegraphqt-0.1.7-py3-none-any.whl
    - name: Run tests
      run: |
        python -m unittest discover zoia_lib/tests/ -v